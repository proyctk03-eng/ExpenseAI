name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Run Pytest
        run: |
          # Bỏ qua một số test có thể cần DB thật, chỉ chạy test logic
          pytest tests/

      - name: Run Bandit Security Check
        run: |
          # Quét bảo mật cơ bản với Bandit
          bandit -r src/ -ll -ii
