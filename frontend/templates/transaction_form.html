<div class="modal fade" id="txModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: var(--radius-lg); border: 1px solid var(--border-color);">
            <div class="modal-header" style="border-bottom: 1px solid var(--border-light);">
                <h5 class="modal-title fw-bold" style="color: var(--text-dark);">
                    <i class="fa-solid fa-plus-circle me-2" style="color: var(--accent-blue);"></i>Thêm Giao dịch mới
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="txForm">
                    <div class="mb-4 text-center">
                        <input type="file" accept="image/*" id="receiptUpload" class="d-none">
                        <button type="button" class="btn btn-outline-primary btn-sm rounded-pill px-3" onclick="document.getElementById('receiptUpload').click()" id="scanReceiptBtn">
                            <i class="fa-solid fa-camera me-1"></i> Quét Hóa Đơn bằng AI
                        </button>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ngày</label>
                        <input type="date" id="txDate" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Số tiền (VNĐ)</label>
                        <div class="input-group">
                            <input type="number" id="txAmount" class="form-control" min="1" step="any" placeholder="Ví dụ: 50000" required>
                            <span class="input-group-text">₫</span>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Danh mục</label>
                        <select id="txCategory" class="form-select">
                            <option value="">✨ AI tự động phân loại</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Mô tả giao dịch</label>
                        <input type="text" id="txDesc" class="form-control" placeholder="VD: Ăn sáng bún bò, Lương làm thêm..." required>
                    </div>
                    <button type="submit" class="btn btn-glass w-100" id="saveBtn">
                        <i class="fa-solid fa-check me-1"></i> Lưu giao dịch
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
let txModal;
let isTxSubmitting = false;

async function loadCategoriesIntoSelect() {
    try {
        const res = await fetch('/api/categories/');
        if (res.ok) {
            const categories = await res.json();
            const select = document.getElementById('txCategory');
            select.innerHTML = '<option value="">✨ AI tự động phân loại</option>';
            
            const expenseGroup = document.createElement('optgroup');
            expenseGroup.label = 'Chi tiêu';
            const incomeGroup = document.createElement('optgroup');
            incomeGroup.label = 'Thu nhập';

            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.id;
                opt.textContent = cat.name;
                if (cat.type === 'income') {
                    incomeGroup.appendChild(opt);
                } else {
                    expenseGroup.appendChild(opt);
                }
            });
            if (expenseGroup.children.length > 0) select.appendChild(expenseGroup);
            if (incomeGroup.children.length > 0) select.appendChild(incomeGroup);
        }
    } catch (e) {
        console.error('Không thể nạp danh mục:', e);
    }
}

document.addEventListener("DOMContentLoaded", () => {
    const modalEl = document.getElementById('txModal');
    if (modalEl) {
        txModal = new bootstrap.Modal(modalEl);
        document.getElementById('txDate').valueAsDate = new Date();
        loadCategoriesIntoSelect();
    }
});

document.getElementById('receiptUpload').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const btn = document.getElementById('scanReceiptBtn');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Đang quét AI...';
    btn.disabled = true;

    const formData = new FormData();
    formData.append('file', file);

    try {
        const res = await fetch('/api/transactions/scan-receipt', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        
        if (res.ok) {
            showToast('Quét hóa đơn thành công! Vui lòng kiểm tra lại.', 'success');
            if (data.amount) document.getElementById('txAmount').value = data.amount;
            if (data.description) document.getElementById('txDesc').value = data.description;
            if (data.transaction_date) document.getElementById('txDate').value = data.transaction_date;
        } else {
            showToast(data.detail || 'Lỗi quét hóa đơn', 'danger');
        }
    } catch (err) {
        showToast('Lỗi kết nối khi quét hóa đơn', 'danger');
    } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
        e.target.value = ''; // Reset input
    }
});

function openCreateModal() {
    document.getElementById('txForm').reset();
    document.getElementById('txDate').valueAsDate = new Date();
    loadCategoriesIntoSelect();
    txModal.show();
}

document.getElementById('txForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (isTxSubmitting) return; // Chống double-submit dồn dập

    const saveBtn = document.getElementById('saveBtn');
    const formInputs = document.querySelectorAll('#txForm input, #txForm select');

    isTxSubmitting = true;
    saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Đang lưu...';
    saveBtn.disabled = true;
    formInputs.forEach(el => el.disabled = true);

    const amount = parseFloat(document.getElementById('txAmount').value);
    const description = document.getElementById('txDesc').value;
    const transaction_date = document.getElementById('txDate').value;
    const catVal = document.getElementById('txCategory').value;
    const category_id = catVal ? parseInt(catVal) : null;

    try {
        const res = await fetch('/api/transactions/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ amount, description, transaction_date, category_id })
        });

        if (res.ok) {
            showToast('Lưu giao dịch thành công!', 'success');
            txModal.hide();
            if (typeof loadTransactions === 'function') loadTransactions();
            if (typeof loadDashboard === 'function') loadDashboard();
        } else {
            const err = await res.json().catch(() => ({}));
            showToast(err.detail || 'Lỗi khi lưu giao dịch', 'danger');
        }
    } catch (err) {
        showToast('Lỗi kết nối khi lưu giao dịch', 'danger');
    } finally {
        saveBtn.innerHTML = '<i class="fa-solid fa-check me-1"></i> Lưu giao dịch';
        saveBtn.disabled = false;
        formInputs.forEach(el => el.disabled = false);
        isTxSubmitting = false;
    }
});
</script>
