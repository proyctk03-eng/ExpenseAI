{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="glass-panel auth-card">
        <div class="text-center mb-4">
            <div style="font-size: 2rem; margin-bottom: 0.5rem;">
                <i class="fa-solid fa-wallet" style="color: var(--accent-blue);"></i>
            </div>
            <h2 class="fw-bold mb-1">Đăng Nhập</h2>
            <p class="text-muted">Chào mừng trở lại ExpenseAI</p>
        </div>

        <div id="errorMsg" class="alert alert-danger d-none" style="font-size: 0.9rem;"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Nhập tên đăng nhập" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
                </div>
            </div>
            <button type="submit" class="btn btn-glass w-100 mb-3">Đăng nhập</button>
        </form>

        <div class="text-center mt-2">
            <span class="text-muted" style="font-size: 0.9rem;">Chưa có tài khoản?</span>
            <a href="/register">Đăng ký ngay</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });

        const data = await res.json();
        if (res.ok) {
            window.location.href = '/';
        } else {
            if (res.status === 429) {
                showToast('Quá nhiều yêu cầu đăng nhập. Vui lòng thử lại sau.', 'danger');
            } else {
                errorMsg.textContent = data.detail || 'Lỗi đăng nhập';
                errorMsg.classList.remove('d-none');
            }
        }
    } catch (err) {
        errorMsg.textContent = 'Không thể kết nối đến server';
        errorMsg.classList.remove('d-none');
    }
});
</script>
{% endblock %}
