<div class="modal fade" id="txModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: var(--radius-lg); border: 1px solid var(--border-color);">
            <div class="modal-header" style="border-bottom: 1px solid var(--border-light);">
                <h5 class="modal-title fw-bold" style="color: var(--text-dark);">
                    <i class="fa-solid fa-plus-circle me-2" style="color: var(--accent-blue);"></i>Thêm Giao dịch mới
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="txForm">
                    <div class="mb-3">
                        <label class="form-label">Ngày</label>
                        <input type="date" id="txDate" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Số tiền (VNĐ)</label>
                        <div class="input-group">
                            <input type="number" id="txAmount" class="form-control" placeholder="Ví dụ: 50000" required>
                            <span class="input-group-text">₫</span>
                        </div>
                        <small class="text-muted mt-1 d-block">Nhập số dương cho chi tiêu, số âm cho thu nhập.</small>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Mô tả (AI sẽ tự phân loại)</label>
                        <input type="text" id="txDesc" class="form-control" placeholder="VD: Ăn sáng bún bò" required>
                    </div>
                    <button type="submit" class="btn btn-glass w-100" id="saveBtn">
                        <i class="fa-solid fa-check me-1"></i> Lưu giao dịch
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
let txModal;

document.addEventListener("DOMContentLoaded", () => {
    txModal = new bootstrap.Modal(document.getElementById('txModal'));
    document.getElementById('txDate').valueAsDate = new Date();
});

function openCreateModal() {
    document.getElementById('txForm').reset();
    document.getElementById('txDate').valueAsDate = new Date();
    txModal.show();
}

document.getElementById('txForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const saveBtn = document.getElementById('saveBtn');
    saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Đang xử lý AI...';
    saveBtn.disabled = true;

    const amount = parseFloat(document.getElementById('txAmount').value);
    const description = document.getElementById('txDesc').value;
    const transaction_date = document.getElementById('txDate').value;

    await fetch('/api/transactions/', {
        method: 'POST',
        body: JSON.stringify({ amount, description, transaction_date, category_id: null })
    });

    saveBtn.innerHTML = '<i class="fa-solid fa-check me-1"></i> Lưu giao dịch';
    saveBtn.disabled = false;
    txModal.hide();
    loadTransactions();
});
</script>
